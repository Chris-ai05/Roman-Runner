<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roman Runner</title>
    <style>
      :root {
        --gold: #d4af37;
        --marble: #f4ecd8;
        --terracotta: #c66b3d;
        --deep-red: #7c1f1f;
        --shadow: rgba(0, 0, 0, 0.55);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1208;
        font-family: 'Trajan Pro', 'Cinzel', Georgia, serif;
        color: var(--marble);
      }

      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #hud {
        position: fixed;
        top: 24px;
        left: 24px;
        right: 24px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
        text-shadow: 0 2px 8px var(--shadow);
      }

      .hud-block {
        background: linear-gradient(180deg, rgba(20,12,4,0.65), rgba(20,12,4,0.35));
        border: 1px solid rgba(212, 175, 55, 0.35);
        padding: 12px 20px;
        border-radius: 4px;
        backdrop-filter: blur(4px);
      }

      .hud-label {
        font-size: 11px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--gold);
        opacity: 0.8;
      }

      .hud-value {
        font-size: 28px;
        font-weight: 700;
        color: var(--marble);
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }

      #overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(20, 10, 4, 0.85), rgba(0, 0, 0, 0.95));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        text-align: center;
        padding: 24px;
      }

      #overlay.hidden { display: none; }

      .title {
        font-size: clamp(40px, 7vw, 84px);
        letter-spacing: 0.15em;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 8px;
        text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      }

      .subtitle {
        font-size: 14px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--marble);
        opacity: 0.7;
        margin-bottom: 48px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px 32px;
        margin-bottom: 48px;
        max-width: 480px;
        font-size: 14px;
        opacity: 0.85;
      }

      .controls span:nth-child(odd) {
        color: var(--gold);
        font-weight: 700;
        text-align: right;
      }

      .controls span:nth-child(even) {
        text-align: left;
      }

      button {
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold);
        padding: 14px 42px;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:hover {
        background: var(--gold);
        color: #1a1208;
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.4);
      }

      .final-score {
        font-size: 18px;
        margin-bottom: 8px;
        opacity: 0.8;
      }

      .final-score strong {
        color: var(--gold);
        font-size: 32px;
        display: block;
        margin-top: 4px;
      }

      .highscore {
        margin: 24px 0 40px;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      .highscore strong { color: var(--gold); }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div class="hud-block">
        <div class="hud-label">Distantia</div>
        <div class="hud-value" id="distance">0</div>
      </div>
      <div class="hud-block" style="text-align: right;">
        <div class="hud-label">Denarii</div>
        <div class="hud-value" id="coins">0</div>
      </div>
    </div>

    <div id="overlay">
      <div class="title">Roman Runner</div>
      <div class="subtitle">— Cursor per Viam Appiam —</div>

      <div class="controls">
        <span>← →</span><span>Bahn wechseln</span>
        <span>↑</span><span>Springen</span>
        <span>↓</span><span>Ducken</span>
      </div>

      <div id="game-over-info" style="display:none;">
        <div class="final-score">
          Distanz <strong id="final-distance">0</strong>
        </div>
        <div class="final-score">
          Denarii <strong id="final-coins">0</strong>
        </div>
        <div class="highscore">Best: <strong id="highscore">0</strong></div>
      </div>

      <button id="start-btn">Incipe</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
